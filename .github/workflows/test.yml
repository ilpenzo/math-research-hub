name: test
on: [push, pull_request]
jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m unittest discover -s template/tools -p 'test_*.py'
      - name: Install expect (for the interactive test)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y expect
      - run: bash tests/test_install.sh
      - name: MathDesk tests
        run: |
          python3 template/harness/tests/test_core.py
          python3 template/harness/tests/test_transcripts.py
          python3 template/harness/tests/test_hubdata.py
          node template/harness/tests/mathsplit.test.js
